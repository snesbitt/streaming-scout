name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of any push: catches content drift (About page
    # copy vs. data/STREAMING_PROFILE.md, see scripts/check-content-drift.mjs)
    # even on a week with no code changes at all. Runs the same job as a
    # normal push, so no separate workflow file or new failure mode.
    - cron: "0 13 * * 1"
    # 2026-08-14: a second weekly run, 2 hours after the one above and 1
    # hour after the "Streaming Scout dismissed-title sync" scheduled task
    # (Mondays 14:00 UTC) — feeds the `smoke` and `live-drift` jobs below, a
    # real answer to roadmap.html Phase 06 / guide.html step 06's own "no
    # automated check that a Monday update actually published" gap.
    # Deliberately a second cron entry rather than reusing the one above:
    # both `smoke` and `live-drift` (see their own `if:` below) only run on
    # a schedule/manual trigger, never on push — hitting the live site right
    # after a push races Netlify's own deploy, which can take longer than
    # the push itself to go live (confirmed the hard way on vinylscout.org,
    # 2026-08-14 — its deploy record was still showing the previous commit
    # 30+ minutes after a push landed on GitHub). A periodic check that
    # doesn't assume "just pushed" == "just deployed" is a more honest
    # signal than a push-triggered one would be.
    - cron: "0 15 * * 1"
  workflow_dispatch: {}
    # 2026-08-14: lets Susan (or a Claude session) trigger the smoke/drift
    # jobs on demand from the Actions tab's "Run workflow" button, without
    # waiting for Monday.

permissions:
  contents: write
  issues: write
  pull-requests: write
  # 2026-08-16: issues:write and pull-requests:write are new. issues:write
  # is used by the failure-reporting step in the smoke/status-drift jobs
  # below (opens/updates a tracking issue). pull-requests:write is used only
  # by the dismiss-drift job's auto-fix step, which opens a PR when it finds
  # and fixes real drift.
  #
  # contents was `read` until run #23 (2026-08-16, the first real
  # workflow_dispatch), which failed with git exit code 128 at "Pushing pull
  # request branch to 'origin/auto/dismiss-drift-sync'". create-pull-request
  # has to push a branch before it can open a PR, and a read-scoped token
  # cannot push anything. Hence contents: write.
  #
  # That widens the token for this whole file, so state plainly what still
  # cannot happen: nothing here pushes to main. dismiss-drift writes only
  # the auto/dismiss-drift-sync branch and opens a PR against main for
  # review; the other jobs never write to the repo at all. Susan's standing
  # rule that only she pushes to main is intact.
  #
  # All of this uses the default, automatically-scoped GITHUB_TOKEN. No PAT
  # or other secret is involved anywhere in this file. The rule about only
  # Susan pushing is about interactive Claude sessions, not this repo's own
  # CI robot acting through GitHub's scoped token inside a single Actions
  # run, which is the same trust boundary as any other bot (e.g. Dependabot)
  # opening a PR.
  #
  # NOTE: the token scope is only half the gate. The repo setting
  # Settings > Actions > General > "Allow GitHub Actions to create and
  # approve pull requests" must also be on, or the PR step fails even with
  # contents: write. Enabled 2026-08-16.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        # As of 2026-08-16, `npm test` also runs check-tap-targets.mjs and
        # check-pick-meta-length.mjs (both offline, no network) alongside
        # the existing logic tests and content-drift check — see each
        # script's own header comment for what real, previously-hand-caught
        # bug each one is a trip-wire for.

  # 2026-08-14: closes the "no automated health check yet" gap roadmap.html
  # Phase 06 and guide.html step 06 both explicitly call out. Mirrors Vinyl
  # Scout's scripts/smoke.mjs pattern (read-only checks against the LIVE
  # site — home page loads, internal docs stay blocked, both Functions are
  # reachable and validating input) but, unlike Vinyl Scout's (manual-only,
  # `npm run smoke`), this one is actually wired into CI on a schedule, not
  # left as a command someone has to remember to run. Deliberately does
  # NOT run on every push (see the cron comment above) — only on the two
  # scheduled triggers or a manual workflow_dispatch, so it never races a
  # not-yet-finished Netlify deploy.
  smoke:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Smoke test the live site
        run: npm run smoke

      - name: Report failure as a GitHub issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Weekly smoke test failed";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "automated-check-failure",
            });
            const match = existing.find(i => i.title === title);
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `scripts/smoke.mjs failed against https://streamingscout.org on a scheduled run. ` +
              `This checks that the live site is fundamentally healthy (home page loads, internal docs stay blocked, both API functions reachable and validating input), not that any specific recent change published. See the run log for which check(s) failed.`;
            if (match) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["automated-check-failure"],
              });
            }

  # 2026-08-16: closes the gap CLAUDE.md's 2026-08-08 entry documents — a
  # title marked "watching" live via /api/status only renders correctly
  # forever once it's ALSO baked into index.html as a static .watching-row
  # (2026-08-10/08-11 entries: two real bugs from this exact gap). Unlike
  # the dismiss-drift job below, this ISN'T mechanically fixable — adding a
  # correct .watching-row needs real editorial judgment (poster art,
  # season/status text), so this stays report-only, same schedule-only
  # placement as `smoke` (live-network, never push-triggered).
  status-drift:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check live "watching" status against index.html's static markup
        run: node scripts/check-status-drift.mjs

      - name: Report failure as a GitHub issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Weekly status-drift check failed";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "automated-check-failure",
            });
            const match = existing.find(i => i.title === title);
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `check-status-drift.mjs found index.html and the live /api/status store disagreeing. It checks two directions; the run log says which one fired. ` +
              `Direction 1, a title marked "watching" live with no matching static markup in index.html: it is only rendering via the fragile live/localStorage path this project has been bitten by twice before (CLAUDE.md 2026-08-10, 2026-08-11), and needs a real .watching-row added by hand with poster art and season/status text. ` +
              `Direction 2, a title marked "watched" live but still rendered in Currently Watching, Top Picks or Coming Soon: either the row is stale, or the live flag is. Check actual viewing before assuming the page is at fault. The on-site "watched" button means "caught up for now" in practice, so for a weekly release the live flag is often the stale side (this happened 2026-08-16 with Reacher S4 and The Westies). ` +
              `Neither direction is auto-fixed: both are content decisions.`;
            if (match) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["automated-check-failure"],
              });
            }

  # 2026-08-16: replaces the "Streaming Scout dismissed-title sync" Claude
  # Code Remote scheduled task referenced in CLAUDE.md's 2026-08-09 entry,
  # which no longer exists (verified via list_triggers — only the artwork
  # sweep and the five-site review remain). That gap was fully mechanical
  # (diff the live /api/dismiss store against data/EXCLUDED_TITLES.md,
  # append what's missing in the file's existing format) with zero
  # editorial judgment, so rather than recreate it as its own agentic
  # session, this job runs check-dismiss-drift.mjs --fix directly in CI and
  # opens a PR via GitHub's own bot identity (peter-evans/create-pull-request,
  # using the default GITHUB_TOKEN, not a session pushing) when it finds and
  # fixes anything. This is the actual "GitHub doing the work" version of
  # that task: no Claude session involved at all, Susan just reviews and
  # merges a PR if one shows up.
  dismiss-drift:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Fetch live dismissals and auto-fix data/EXCLUDED_TITLES.md if anything's missing
        run: node scripts/check-dismiss-drift.mjs --fix

      - name: Open a PR if EXCLUDED_TITLES.md changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "data/EXCLUDED_TITLES.md: sync titles dismissed live but missing from the file"
          branch: auto/dismiss-drift-sync
          delete-branch: true
          title: "Auto: sync dismissed-title exclusions from the live site"
          body: >
            Opened automatically by the weekly `dismiss-drift` job in
            `.github/workflows/test.yml`. `scripts/check-dismiss-drift.mjs --fix`
            found one or more titles dismissed live via `/api/dismiss` that
            weren't yet reflected in `data/EXCLUDED_TITLES.md`, and appended
            them in the file's existing format. Review the diff and merge if
            it looks right. These titles are otherwise vulnerable to
            reappearing in the next Coming Soon/Top Picks rebuild.
          labels: automated-pr

  # 2026-08-17: the tick-button counterpart to dismiss-drift above. Susan
  # confirmed the on-site tick means "seen it, take it away", not "I watched
  # this on this date". Clicking it writes `watched` to /api/status and
  # nothing else, so the row stays in index.html and the title stays absent
  # from data/STREAMING_LOG.md, leaving the next rebuild free to recommend it
  # straight back. That had to be cleaned up by hand twice on 2026-08-17
  # alone, the second time within hours of the first.
  #
  # Mechanical enough to auto-fix, unlike status-drift: the entry text is
  # fixed, the date comes from the live record, and the rows to remove are
  # identified by exact title. scripts/check-watched-drift.mjs deliberately
  # does NOT touch Currently Watching or In Theaters rows, where a tick may
  # mean "finished this season" and the replacement is an editorial call.
  #
  # It removes the Top Picks / Coming Soon rows in the same commit as the log
  # entry on purpose. The log entry alone would make check-picks-against-log
  # fail on main and block every later push until a human deleted the row by
  # hand, which is worse than the bug it fixes.
  watched-drift:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Record titles ticked live, and drop their Top Picks / Coming Soon rows
        run: node scripts/check-watched-drift.mjs --fix

      - name: Open a PR if anything was recorded
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "data/STREAMING_LOG.md: record titles cleared with the tick button, and drop their rows"
          branch: auto/watched-drift-sync
          delete-branch: true
          title: "Auto: record titles cleared on the live site"
          body: >
            Opened automatically by the weekly `watched-drift` job in
            `.github/workflows/test.yml`.
            `scripts/check-watched-drift.mjs --fix` found one or more titles
            Susan cleared on the live site with the tick button that were not
            yet in `data/STREAMING_LOG.md`, recorded them, and removed their
            Top Picks / Coming Soon rows from `index.html`.
            Check two things before merging. First, that each title really is
            one she has seen rather than a mis-tap, since the log is what stops
            it being recommended again. Second, that the dates read as CLEAR
            dates: a tick carries no watch date, the entries say
            "watch date unknown", and nothing downstream should treat these as
            recent viewing. Currently Watching and In Theaters rows are left
            alone by design.
          labels: automated-pr

  # 2026-08-17: closes the last item on roadmap.html Phase 06, "automated
  # backups are still ahead," and closes it against the hole that is actually
  # still open rather than the one the phrase implies.
  #
  # data/ has been version-controlled since 2026-07-21, so every past version
  # of the log, taste profile and exclusion list is already recoverable from
  # git; the check-data-integrity.mjs trip-wire in `npm test` covers the other
  # half of that (git keeps every version but does not notice a truncation).
  # The watching/watched flags in the `title-status` Blobs store and the
  # dismissals in `dismissed-titles` are the genuinely unbacked thing: they
  # exist only inside Netlify, are written by an unauthenticated endpoint from
  # any device, and if that store were wiped there would be nothing at all to
  # restore from.
  #
  # Same shape as dismiss-drift above: schedule/workflow_dispatch only (it is
  # a live-network job, and a push-triggered live check races Netlify's own
  # deploy), and it opens a PR through GitHub's own bot identity rather than
  # pushing. The script refuses to overwrite a good snapshot with a smaller or
  # empty one, and writes nothing at all when the records have not changed, so
  # a quiet week produces no PR.
  backup:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Snapshot the live watching/dismissed records
        run: node scripts/backup-live-records.mjs

      - name: Open a PR if the snapshot changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "backups/live-records: snapshot the live watching and dismissed records"
          branch: auto/live-records-backup
          delete-branch: true
          title: "Auto: back up the live watching and dismissed records"
          body: >
            Opened automatically by the weekly `backup` job in
            `.github/workflows/test.yml`. `scripts/backup-live-records.mjs`
            found the live `/api/status` and `/api/dismiss` records had
            changed since the last snapshot and wrote a new dated copy under
            `backups/live-records/`. These records live only in Netlify Blobs
            and have no other backup, so merging this is what makes them
            recoverable. Review the diff for anything that looks like loss
            rather than normal activity, then merge. If records went missing,
            do NOT merge: the previous snapshot is what you would restore
            from. The script refuses to write a snapshot smaller than the
            last one, so a shrink shows up as a failed job, not a quiet
            overwrite.
          labels: automated-pr
